name: Build eSpeak NG 32-bit (fa → en-us)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-espeak-32bit.yml'
      - 'patches/**'

jobs:
  build-win32:
    runs-on: windows-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW32
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            git
            make
            python

      - name: Clone eSpeak NG (modern, CMake)
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/espeak-ng/espeak-ng.git espeak-ng
          cd espeak-ng
          git log -1 --oneline

      - name: Apply Persian to en-us patch
        shell: msys2 {0}
        run: |
          cd espeak-ng
          python - << 'PY'
          with open("src/libespeak-ng/translate.c", "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          markers = [
              ('''\t\t\t\tconst char *new_language;\n\t\t\t\tnew_language = (char *)(&p[1]);\n\t\t\t\tif (new_language[0] == 0)\n\t\t\t\t\tnew_language = ESPEAKNG_DEFAULT_VOICE;\n\n\t\t\t\tswitch_phonemes = SetTranslator2(new_language);''',
               '''\t\t\t\tconst char *new_language;\n\t\t\t\tnew_language = (char *)(&p[1]);\n\t\t\t\tif (new_language[0] == 0)\n\t\t\t\t\tnew_language = ESPEAKNG_DEFAULT_VOICE;\n\n\t\t\t\t// Persian (fa): force English fallback to American English (en-us)\n\t\t\t\tif (translator != NULL && translator->translator_name == L('f', 'a') &&\n\t\t\t\t    (strcmp(new_language, "en") == 0 || strcmp(new_language, "EN") == 0 ||\n\t\t\t\t     strcmp(new_language, "en-gb") == 0 || strcmp(new_language, "en-GB") == 0)) {\n\t\t\t\t\tnew_language = "en-us";\n\t\t\t\t}\n\n\t\t\t\tswitch_phonemes = SetTranslator2(new_language);'''),
              ('''\t\t\t\tnew_language = (char *)(&p[1]);\n\t\t\t\tif (new_language[0] == 0)\n\t\t\t\t\tnew_language = ESPEAKNG_DEFAULT_VOICE;\n\n\t\t\t\tswitch_phonemes = SetTranslator2(new_language);''',
               '''\t\t\t\tnew_language = (char *)(&p[1]);\n\t\t\t\tif (new_language[0] == 0)\n\t\t\t\t\tnew_language = ESPEAKNG_DEFAULT_VOICE;\n\n\t\t\t\t// Persian (fa): force English fallback to American English (en-us)\n\t\t\t\tif (translator != NULL && translator->translator_name == L('f', 'a') &&\n\t\t\t\t    (strcmp(new_language, "en") == 0 || strcmp(new_language, "EN") == 0 ||\n\t\t\t\t     strcmp(new_language, "en-gb") == 0 || strcmp(new_language, "en-GB") == 0)) {\n\t\t\t\t\tnew_language = "en-us";\n\t\t\t\t}\n\n\t\t\t\tswitch_phonemes = SetTranslator2(new_language);'''),
          ]

          applied = False
          for old, new in markers:
              if old in content:
                  content = content.replace(old, new)
                  applied = True
                  print("Patch applied")
                  break

          if not applied:
              print("WARNING: pattern not found")
              idx = content.find("SetTranslator2(new_language)")
              print(repr(content[max(0,idx-250):idx+50]) if idx > 0 else "not found")
          else:
              with open("src/libespeak-ng/translate.c", "w", encoding="utf-8") as f:
                  f.write(content)
          PY
          grep -n "en-us\|Persian" src/libespeak-ng/translate.c || true

      - name: Configure CMake 32-bit
        shell: msys2 {0}
        run: |
          cd espeak-ng
          mkdir -p build32
          cd build32
          cmake .. \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=i686-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=i686-w64-mingw32-g++ \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DUSE_SPEECHPLAYER=OFF \
            -DUSE_LIBSONIC=OFF \
            -DUSE_LIBPCAUDIO=OFF \
            -DUSE_ASYNC=OFF

      - name: Build DLL
        shell: msys2 {0}
        run: |
          cd espeak-ng/build32
          cmake --build . --target espeak-ng -j$(nproc)
          ls -la src/libespeak-ng.dll || ls -la *.dll || find . -name "*.dll"

      - name: Prepare artifact
        shell: msys2 {0}
        run: |
          mkdir -p artifact
          if [ -f espeak-ng/build32/src/libespeak-ng.dll ]; then
            cp espeak-ng/build32/src/libespeak-ng.dll artifact/espeak.dll
          elif [ -f espeak-ng/build32/libespeak-ng.dll ]; then
            cp espeak-ng/build32/libespeak-ng.dll artifact/espeak.dll
          else
            find espeak-ng -name "*.dll"
            exit 1
          fi
          ls -la artifact/

      - name: Upload 32-bit DLL
        uses: actions/upload-artifact@v4
        with:
          name: espeak-ng-32bit-fa-en-us
          path: artifact/espeak.dll
          retention-days: 30
